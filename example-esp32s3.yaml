esphome:
  name: paulmann-esp32s3
  friendly_name: Paulmann ESP32-S3

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: VERBOSE

api:
  encryption:
    key: !secret paulmann_esp32s3__encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:

external_components:
  - source:
      type: git
      url: https://github.com/bingete/esphome-paulmann-lights
      ref: main
    refresh: 0s
    components: [paulmann_lights]

paulmann_lights:
  - id: bedroom_paulmann
    name: "Bedroom Paulmann"
    mac_address: "AA:BB:CC:DD:EE:FF"
    password: !secret paulmann_password
    connection_retries: 5
    update_interval: 30s

light:
  - platform: paulmann_lights
    name: "Bedroom Light"
    paulmann_lights_id: bedroom_paulmann

number:
  - platform: paulmann_lights
    timer:
      name: "Bedroom Timer"
      paulmann_lights_id: bedroom_paulmann
    working_mode:
      name: "Bedroom Working Mode"
      paulmann_lights_id: bedroom_paulmann
    controller_enable:
      name: "Bedroom Controller Enable"
      paulmann_lights_id: bedroom_paulmann

text_sensor:
  - platform: paulmann_lights
    system_id:
      name: "Bedroom System ID"
      paulmann_lights_id: bedroom_paulmann
    model:
      name: "Bedroom Model"
      paulmann_lights_id: bedroom_paulmann
    serial_number:
      name: "Bedroom Serial Number"
      paulmann_lights_id: bedroom_paulmann
    firmware_revision:
      name: "Bedroom Firmware Revision"
      paulmann_lights_id: bedroom_paulmann
    hardware_revision:
      name: "Bedroom Hardware Revision"
      paulmann_lights_id: bedroom_paulmann
    software_revision:
      name: "Bedroom Software Revision"
      paulmann_lights_id: bedroom_paulmann
    manufacturer:
      name: "Bedroom Manufacturer"
      paulmann_lights_id: bedroom_paulmann
    ieee_certification:
      name: "Bedroom IEEE Certification"
      paulmann_lights_id: bedroom_paulmann
    pnp_id:
      name: "Bedroom PnP ID"
      paulmann_lights_id: bedroom_paulmann
